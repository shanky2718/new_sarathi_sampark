services:
  - type: web
    name: sarathi-samparka-backend
    env: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: sarathi_sampark_db
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
